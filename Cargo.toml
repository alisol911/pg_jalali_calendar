[package]
name = "pg_jalali_calendar"
version = "0.1.0"
edition = "2024"
resolver = "3"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = []

[dependencies]
chrono = "0.4.45"
date_component = "0.4.8"
icu = "2.3.1"
icu_calendar = "2.3.0"
pgrx = "0.19.3"
rust-persian-tools = "1.1.4"

[dev-dependencies]
pgrx-tests = "0.19.3"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
